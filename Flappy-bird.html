<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird 🐦</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; background: #1a1a2e; font-family: 'Trebuchet MS', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; }
#game-container { position: relative; width: 100vw; height: 100vh; max-width: 500px; max-height: 800px; overflow: hidden; border-radius: 12px; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
canvas { display: block; width: 100% !important; height: 100% !important; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; background: rgba(0,0,0,0.78); color: #fff; z-index: 10; backdrop-filter: blur(4px); }
.screen.active { display: flex; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
h1 { font-size: 2.4rem; color: #ffd93d; text-shadow: 3px 3px 0 #000, 0 0 20px #ffd93d88; animation: bounce 1.5s infinite; }
h2 { font-size: 1.8rem; color: #ffd93d; text-shadow: 2px 2px 0 #000; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.difficulty-selector { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; }
.diff-btn { display: flex; flex-direction: column; align-items: center; padding: 10px; background: linear-gradient(135deg, #4facfe, #00f2fe); border-radius: 10px; cursor: pointer; transition: all 0.2s; border: 3px solid transparent; }
.diff-btn:hover { transform: scale(1.05); }
.diff-btn.selected { border-color: #ffd93d; box-shadow: 0 0 15px #ffd93d; transform: scale(1.05); }
.diff-label { font-weight: bold; font-size: 1.1rem; }
.stars { font-size: 1rem; color: #ffd93d; letter-spacing: 2px; }
.menu-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.main-btn, .secondary-btn { padding: 12px 28px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.main-btn { background: linear-gradient(135deg, #ffd93d, #ff9a3d); color: #000; box-shadow: 0 4px 0 #b8730a; }
.main-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #b8730a; }
.main-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8730a; }
.secondary-btn { background: #333; color: #fff; border: 2px solid #666; }
.secondary-btn:hover { background: #444; }
.best-score { margin-top: 10px; font-size: 1rem; color: #ffd93d; }
.setting-group { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; align-items: center; }
.theme-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.theme-btn { padding: 10px; background: #333; color: #fff; border: 2px solid #555; border-radius: 8px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.theme-btn:hover { background: #444; }
.theme-btn.selected { border-color: #ffd93d; background: #4facfe; box-shadow: 0 0 10px #ffd93d; }
input[type="checkbox"] { transform: scale(1.3); cursor: pointer; margin-left: 8px; }
#pause-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; gap: 12px; z-index: 20; text-align: center; }
#pause-overlay.active { display: flex; }
#pause-btn { position: absolute; top: 12px; right: 12px; width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; border: 2px solid #fff; font-size: 1.4rem; cursor: pointer; z-index: 15; display: none; transition: all 0.2s; }
#pause-btn:hover { background: rgba(0,0,0,0.8); }
#pause-btn.visible { display: block; }
@media (max-width: 600px) { h1 { font-size: 1.8rem; } h2 { font-size: 1.4rem; } .main-btn, .secondary-btn { padding: 10px 20px; font-size: 1rem; } }
</style>
</head>
<body>
<div id="game-container">
  <div id="menu" class="screen active">
    <h1>🐦 Flappy Bird</h1>
    <div class="difficulty-selector">
      <div class="diff-btn" data-diff="easy"><span class="diff-label">Facile</span><span class="stars">⭐☆☆</span></div>
      <div class="diff-btn" data-diff="normal"><span class="diff-label">Normal</span><span class="stars">⭐⭐☆</span></div>
      <div class="diff-btn" data-diff="hard"><span class="diff-label">Difficile</span><span class="stars">⭐⭐⭐</span></div>
    </div>
    <div class="menu-buttons">
      <button id="btn-play" class="main-btn">▶ Jouer</button>
      <button id="btn-settings" class="secondary-btn">⚙ Paramètres</button>
    </div>
    <p class="best-score">🏆 Meilleur score : <span id="menu-best">0</span></p>
  </div>

  <div id="settings" class="screen">
    <h2>⚙ Paramètres</h2>
    <div class="setting-group">
      <label>Thème :</label>
      <div class="theme-btns">
        <button class="theme-btn" data-theme="classic">☀ Classique</button>
        <button class="theme-btn" data-theme="space">🚀 Espace</button>
        <button class="theme-btn" data-theme="night">🌙 Nuit</button>
        <button class="theme-btn" data-theme="sunset">🌅 Coucher</button>
      </div>
    </div>
    <div class="setting-group"><label>Son : <input type="checkbox" id="sound-toggle" checked></label></div>
    <div class="setting-group"><label>Particules : <input type="checkbox" id="particles-toggle" checked></label></div>
    <div class="setting-group"><label>Mode jour/nuit auto : <input type="checkbox" id="daynight-toggle" checked></label></div>
    <button id="btn-back" class="main-btn">⬅ Retour</button>
  </div>

  <div id="gameover" class="screen">
    <h2>💥 Game Over</h2>
    <p>Score : <span id="final-score">0</span></p>
    <p>Meilleur : <span id="best-score">0</span></p>
    <div class="menu-buttons">
      <button id="btn-retry" class="main-btn">🔄 Rejouer</button>
      <button id="btn-home" class="secondary-btn">🏠 Menu</button>
    </div>
  </div>

  <div id="pause-overlay">
    <h2>⏸ Pause</h2>
    <p>Appuie sur P ou touche le bouton pour reprendre</p>
  </div>

  <button id="pause-btn" title="Pause">⏸</button>
</div>

<script>
window.addEventListener('load', () => {
  const CONFIG = {
    gravity: 0.5, flapStrength: -8, pipeWidth: 70,
    pipeGap: { easy: 220, normal: 170, hard: 130 },
    pipeSpacing: { easy: 320, normal: 280, hard: 240 },
    pipeSpeed: { easy: 3.2, normal: 4, hard: 4.8 },
    birdSize: 34,
  };

  const THEMES = {
    classic: { sky: [135, 206, 235], ground: [222, 184, 135], pipe: [80, 200, 80], pipeDark: [40, 140, 40] },
    space:   { sky: [10, 5, 40],     ground: [40, 20, 60],    pipe: [150, 100, 220], pipeDark: [80, 40, 140] },
    night:   { sky: [20, 24, 82],    ground: [30, 30, 50],    pipe: [100, 150, 220], pipeDark: [50, 80, 140] },
    sunset:  { sky: [255, 140, 90],  ground: [120, 60, 40],   pipe: [200, 100, 100], pipeDark: [140, 60, 60] },
  };

  let canvasW, canvasH;
  let bird, pipes, particles, score, bestScore, state, frameCount = 0;
  let difficulty = 'normal', theme = 'classic';
  let soundEnabled = true, particlesEnabled = true, dayNightAuto = true;
  let isNightMode = false, dayNightTimer = 0, audioCtx = null;

  const menuEl = document.getElementById('menu');
  const settingsEl = document.getElementById('settings');
  const gameoverEl = document.getElementById('gameover');
  const pauseOverlay = document.getElementById('pause-overlay');
  const pauseBtn = document.getElementById('pause-btn');

  // === BIND UI en premier (indépendant de p5) ===
  function bindUI() {
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        difficulty = btn.dataset.diff;
      });
    });
    document.querySelector('.diff-btn[data-diff="normal"]').classList.add('selected');

    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-settings').addEventListener('click', () => {
      menuEl.classList.remove('active'); settingsEl.classList.add('active');
    });
    document.getElementById('btn-back').addEventListener('click', () => {
      settingsEl.classList.remove('active'); menuEl.classList.add('active');
    });
    document.getElementById('btn-retry').addEventListener('click', startGame);
    document.getElementById('btn-home').addEventListener('click', () => {
      gameoverEl.classList.remove('active'); menuEl.classList.add('active');
      document.getElementById('menu-best').textContent = bestScore;
      state = 'menu'; resetGame(); pauseBtn.classList.remove('visible');
    });
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected'); theme = btn.dataset.theme;
      });
    });
    document.querySelectorTime('.(theme-btn[data-theme="classic"]0').classList.add('selected');

    document.getElementById('sound-toggle.').addEventListener('change', e => soundEnabled = e001.target.checked);
    document.getElementById('particles-toggle').addEventListener,('change', e => particlesEnabled = now e.target.checked);
    document.getElementById('daynight-toggle +').addEventListener('change', e => dayNightAuto =  e.target.checked);
    pauseBtn.addEventListener('click', togglePause);
    pauseOverlay.addEventListener('click', togglePause);
  }

0  function resetGame() {
    bird = { x: canvas.W * 0.3, y:15 canvasH / 2, vy: 0, rotation);
: 0 };
    pipes =        []; particles = []; score =  osc0; frameCount = 0; dayNightTimer =.start 0;
  }

  function( startGame() {
    menuEl.classListnow.remove('active');
    settingsEl.classList.remove('active');
    gameoverEl.classList.remove('active');
    pauseOverlay.classList.remove('active');
    resetGame();
    state = 'playing';
    pauseBtn.classList.add('visible');
    flap();
  }

  function togglePause() {
    if (state === 'playing') { state = 'paused'; pauseOverlay.classList.add('active'); }
    else if (state === 'paused') { state = 'playing'; pauseOverlay.classList.remove('active'); }
  }

  function gameOver() {
    state = 'gameover';
    pauseBtn.classList.remove('visible');
    if (score > bestScore) { bestScore = score; localStorage.setItem('flappy_best', bestScore); }
    document.getElementById('final-score').textContent = score;
    document.getElementById('best-score').textContent = bestScore;
    gameoverEl.classList.add('active');
    playSound('hit');
    if (particlesEnabled) burstParticles(bird.x, bird.y, 30);
  }

  function flap() {
    if (state !== 'playing') return;
    bird.vy = CONFIG.flapStrength;
    playSound('flap');
    if (particlesEnabled) {
      for (let i = 0; i < 4; i++) particles.push({ x: bird.x - 10, y: bird.y + 10, vx: random(-2, -0.5), vy: random(-1, 1), life: 20, color: [255, 255, 255] });
    }
  }

  // === SONS ===
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playSound(type) {
    if (!soundEnabled) return;
    try {
      initAudio();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (type === 'flap') {
        osc.type = 'square'; osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'score') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAt); osc.stop(now + 0.15);
      } else if (type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      }
    } catch(e) {}
  }

  function burstParticles(x, y, n) {
    for (let i = 0; i < n; i++) particles.push({ x, y, vx: random(-5, 5), vy: random(-6, 2), life: 40, color: [random(180, 255), random(100, 200), random(0, 100)] });
  }
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // === UPDATE ===
  function update() {
    if (state !== 'playing') return;
    frameCount++;
    bird.vy += CONFIG.gravity;
    bird.y += bird.vy;
    bird.rotation = constrain(map(bird.vy, -10, 10, -0.5, 1.2), -0.5, 1.2);

    if (bird.y + CONFIG.birdSize / 2 >= canvasH - 60) { bird.y = canvasH - 60 - CONFIG.birdSize / 2; return gameOver(); }
    if (bird.y - CONFIG.birdSize / 2 < 0) { bird.y = CONFIG.birdSize / 2; bird.vy = 0; }

    const speed = CONFIG.pipeSpeed[difficulty];
    const spacing = CONFIG.pipeSpacing[difficulty];
    const gap = CONFIG.pipeGap[difficulty];

    if (pipes.length === 0 || pipes[pipes.length - 1].x < canvasW - spacing) {
      const topH = random(80, canvasH - 60 - gap - 80);
      pipes.push({ x: canvasW, topH, gap, width: CONFIG.pipeWidth, scored: false });
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= speed;
      if (!p.scored && p.x + p.width < bird.x) {
        p.scored = true; score++; playSound('score');
        if (particlesEnabled) for (let k = 0; k < 8; k++) particles.push({ x: bird.x, y: bird.y, vx: random(-3, 3), vy: random(-3, 3), life: 30, color: [255, 215, 0] });
      }
      if (bird.x + CONFIG.birdSize / 2 > p.x && bird.x - CONFIG.birdSize / 2 < p.x + p.width) {
        if (bird.y - CONFIG.birdSize / 2 < p.topH || bird.y + CONFIG.birdSize / 2 > p.topH + p.gap) return gameOver();
      }
      if (p.x + p.width < 0) pipes.splice(i, 1);
    }
    updateParticles();
    if (dayNightAuto) { dayNightTimer++; if (dayNightTimer > 900) { isNightMode = !isNightMode; dayNightTimer = 0; } }
    else isNightMode = (theme === 'night' || theme === 'space');
  }

  // === DRAW ===
  function drawBackground() {
    const t = THEMES[theme];
    let sky = [...t.sky];
    if (isNightMode) sky = sky.map(c => c * 0.35);
    for (let y = 0; y < canvasH; y++) {
      const inter = map(y, 0, canvasH, 0, 1);
      stroke(lerpColor(color(sky[0], sky[1], sky[2]), color(sky[0]*0.8, sky[1]*0.85, sky[2]), inter));
      line(0, y, canvasW, y);
    }
    noStroke();
    if (isNightMode) {
      fill(255, 255, 255, 200);
      for (let i = 0; i < 40; i++) circle((i * 137.5) % canvasW, (i * 71.3) % (canvasH - 60), (i % 3) + 1);
    }
    if (theme === 'space') {
      fill(180, 130, 220, 150); circle(canvasW * 0.8, 120, 90);
      fill(120, 80, 180, 100); circle(canvasW * 0.2, 250, 60);
    } else if (!isNightMode) {
      fill(255, 255, 255, 200);
      const cl = (frameCount * 0.3) % (canvasW + 200);
      circle(canvasW - cl + 100, 100, 60);
      circle(canvasW - cl + 140, 120, 45);
    } else {
      fill(240, 240, 200, 220); circle(canvasW * 0.8, 90, 55);
      fill(220, 220, 180, 150); circle(canvasW * 0.78, 85, 12); circle(canvasW * 0.83, 100, 8);
    }
  }

  function drawPipes() {
    const t = THEMES[theme];
    for (const p of pipes) {
      fill(t.pipe[0], t.pipe[1], t.pipe[2]);
      rect(p.x, 0, p.width, p.topH);
      rect(p.x, p.topH + p.gap, p.width, canvasH - 60 - p.topH - p.gap);
      fill(t.pipeDark[0], t.pipeDark[1], t.pipeDark[2]);
      rect(p.x + p.width - 12, 0, 12, p.topH);
      rect(p.x + p.width - 12, p.topH + p.gap, 12, canvasH - 60 - p.topH - p.gap);
      fill(t.pipe[0] - 20, t.pipe[1] - 20, t.pipe[2] - 20);
      rect(p.x - 5, p.topH - 25, p.width + 10, 25, 4);
      rect(p.x - 5, p.topH + p.gap, p.width + 10, 25, 4);
    }
  }

  function drawGround() {
    const t = THEMES[theme];
    let g = t.ground;
    if (isNightMode) g = g.map(c => c * 0.4);
    fill(g[0], g[1], g[2]);
    rect(0, canvasH - 60, canvasW, 60);
    fill(0, 60);
    const offset = (frameCount * CONFIG.pipeSpeed[difficulty]) % 40;
    for (let x = -offset; x < canvasW; x += 40) rect(x, canvasH - 55, 20, 4);
    fill(0, 100); rect(0, canvasH - 60, canvasW, 4);
  }

  function drawBirdShape(x, y, rot) {
    push(); translate(x, y); rotate(rot);
    fill(255, 220, 60); stroke(0); strokeWeight(2);
    ellipse(0, 0, CONFIG.birdSize, CONFIG.birdSize * 0.85);
    fill(255, 180, 30);
    ellipse(-4, sin(frameCount * 0.5) * 3, 16, 12);
    fill(255); ellipse(6, -6, 12, 12);
    fill(0); circle(8, -6, 6);
    fill(255); circle(9, -7, 2);
    fill(255, 100, 30);
    triangle(14, -2, 24, 2, 14, 6);
    noFill(); stroke(0); strokeWeight(2);
    ellipse(0, 0, CONFIG.birdSize, CONFIG.birdSize * 0.85);
    pop();
  }

  function draw() {
    update();
    drawBackground();
    drawPipes();
    drawGround();
    if (particlesEnabled) {
      for (const p of particles) {
        fill(p.color[0], p.color[1], p.color[2], p.life / 40 * 255);
        circle(p.x, p.y, 6);
      }
    }
    if (state === 'menu') {
      drawBirdShape(canvasW / 2, canvasH * 0.7, sin(frameCount * 0.05) * 0.2);
    } else {
      drawBirdShape(bird.x, bird.y, bird.rotation);
      fill(255); stroke(0); strokeWeight(4);
      textAlign(CENTER, TOP); textSize(48);
      text(score, canvasW / 2, 30);
      noStroke();
    }
  }

  // === Lancement p5 + init ===
  window.setup = function() {
    const container = document.getElementById('game-container');
    canvasW = container.clientWidth;
    canvasH = container.clientHeight;
    const cnv = createCanvas(canvasW, canvasH);
    cnv.parent(container);
    cnv.style('position', 'absolute');
    cnv.style('top', '0'); cnv.style('left', '0'); cnv.style('z-index', '1');
    bestScore = parseInt(localStorage.getItem('flappy_best') || '0');
    document.getElementById('menu-best').textContent = bestScore;
    resetGame();
    state = 'menu';
    noStroke();
  };

  window.draw = draw;

  window.keyPressed = function() {
    if (key === ' ' || keyCode === UP_ARROW) {
      if (state === 'playing') flap();
      else if (state === 'menu') startGame();
      return false;
    }
    if (key === 'p' || key === 'P') togglePause();
  };

  window.mousePressed = function() { if (state === 'playing') flap(); };
  window.touchStarted = function() { if (state === 'playing') { flap(); return false; } };

  bindUI();
});
</script>
</body>
</html>
